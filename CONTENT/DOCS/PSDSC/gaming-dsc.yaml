# first install latest DSC 3.0
# run powershell as admin and use:
# winget search DesiredStateConfiguration
# then choose the preview with: winget install --id (ID FOUND WITH PREVIOUS COMMAND) --source msstore
# first you get test if the configuration match with: dsc config test --file .\gaming-dsc.yaml
# Then to apply the configuration use: dsc config set --file .\gaming-dsc.yaml
# PS: Im still working on adding service and scheduled task to the newer DSC script


# yaml-language-server: $schema=https://aka.ms/dsc/schemas/v3/bundled/config/document.vscode.json
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:
  
  ###########################
  # USER SETTINGS/PREFERENCES
  ###########################
  # Privacy Settings
  # https://privacyamp.com/knowledge-base/windows-10-privacy-settings/
  - name: ShowAllIconTaskbar
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer
      valueName: EnableAutoTray
      valueData:
        DWord: 0
  - name: DisableWidgets
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: HKLM\SOFTWARE\Policies\Microsoft\Dsh
      valueName: AllowNewsAndInterests
      valueData:
        DWord: 0
  - name: VisualEffects
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects
      valueName: VisualFXSetting
      valueData:
        DWord: 2
  #Disable Enhanced Pointer Precision set 6/11
  - name: MouseSpeed
    type: Microsoft.Windows/Registry
    properties:
      _exist: true
      keyPath: HKCU\Control Panel\Mouse
      valueName: MouseSpeed
      valueData:
        String: "0"
  - name: MouseThreshold1
    type: Microsoft.Windows/Registry
    properties:
